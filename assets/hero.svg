<title id="t">Awesome AI Dev Workflows</title>
<desc id="d">A loop of eight software lifecycle stages (plan, understand, build, review, test, CI and ship, operate, maintain) resting on five foundations: context and instructions, orchestration, MCP and skills, sandboxes and permissions, evaluation and cost.</desc>
